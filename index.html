<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quoridor</title>
<style>

  /* Each player's color is defined once here, then referenced by name
     everywhere else via var(--name). */
  :root {
    --player0-color: #4da3ff;
    --player1-color: #FF7F7F;
    --logo-color: #aaa;
  }

  body {
    font-family: sans-serif;
    background: #1e1e1e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0.2rem 2rem 1rem; /* top, sides, bottom -- less space above than the other edges */
  }

  h1 {
    margin: 0.1rem 0; /* browsers give h1 a large default margin -- shrink it */
  }

  /* logo.svg used as a stencil, so the background color becomes the letter color */
  .logo {
    width: 320px;
    aspect-ratio: 643 / 160;
    background: var(--logo-color);
    -webkit-mask: url(logo.svg) center / contain no-repeat;
    mask: url(logo.svg) center / contain no-repeat;
  }

  .credit {
    margin: 0 0 0.4rem 50%; /* sits under the right half, like the box */
    background: #b3191c;
    color: #fff;
    font-size: 0.75rem;
    padding: 0.1rem 0.5rem;
  }

  h3 {
    margin: 0.3rem 0 0.15rem; /* same idea, tighter above/below every section heading */
  }

  /* 2x2: settings boxes on top, color dropdowns lined up underneath */
  .settings-grid {
    display: inline-grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.3rem;
  }
  .settings-grid label { display: flex; gap: 0.3rem; align-items: center; }
  .settings-grid select { flex: 1; } /* stretch to match the box above */

  .primary-btn {
    font-size: 1.2rem;
    font-weight: bold;
    padding: 0.5rem 1.5rem;
    margin-top: 0.3rem; /* same small gap used elsewhere (h3 margins, etc.) */
  }

  #game-columns {
    display: flex;
    align-items: flex-start;
    gap: 2rem;
  }
  #move-log {
    min-width: 200px;
  }
  #move-log-list {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }

  #status {
    margin-bottom: 0.4rem;
    text-align: center;
  }
  #status.my-turn {
    color: #4caf50;
    font-size: 1.6rem;
    font-weight: bold;
  }
  #status.game-over {
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(90deg, #ffd700, #ff6b6b, #4ecdc4, #ffd700);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 2s linear infinite, pop-in 0.4s ease-out;
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }
  @keyframes pop-in {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #confetti-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 1000;
  }
  .confetti-piece {
    position: absolute;
    top: -10px;
    width: 10px;
    height: 10px;
    opacity: 0.9;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    to { top: 110%; transform: rotate(360deg); }
  }

  /* #board is a CSS grid, alternating a thin "gutter" between
     every pair of cells for fences Fences So the full grid
     is (2N - 1) tracks wide and tall (2N - 1) tracks tall:
 */
  /* board-wrapper places the letter row and number column around the
     board itself in a 2x2 outer grid: labels in row 1 / column 1,
     the board in the bottom-right cell. */
  #board-wrapper {
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto 1fr;
  }
  #col-labels { grid-column: 2; grid-row: 1; display: grid; }
  #row-labels { grid-column: 1; grid-row: 2; display: grid; }
  #board      { grid-column: 2; grid-row: 2; }

  .board-label {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #aaa;
    padding: 0 0.3rem;
  }

  #board {
    display: grid;
    background: #444;
    border: 3px solid #666;
    width: fit-content;
    height: fit-content;
  }

  .cell {
    background: #C79377; /* board square color */
  }

  .gutter {
    background: transparent; /* empty space unless a fence occupies it */
  }

  .fence {
    border-radius: 2px;
  }
  .fence.owner-0 { background: var(--player0-color); } /* player 1's fences */
  .fence.owner-1 { background: var(--player1-color); } /* player 2's fences */

  .piece {
    width: 70%;
    height: 70%;
    margin: 15%;
    border-radius: 50%;
    box-sizing: border-box;
    border: 2px solid #222;
  }
  .piece.owner-0 { background: var(--player0-color); } /* player 1's piece */
  .piece.owner-1 { background: var(--player1-color); } /* player 2's piece */

  #players {
    display: flex;
    gap: 2rem;
    margin-top: 0.4rem;
  }
  .player-card {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: 2px solid transparent;
  }
  .player-card.turn { border-color: #fff; }
  .player-card.owner-0 { background: var(--player0-color); }
  .player-card.owner-1 { background: var(--player1-color); }
</style>
</head>
<body>

  <header>
    <h1 class="logo" aria-label="Quoridor"></h1>
    <div class="credit">Mirko Marchesi</div>
  </header>
  <div id="confetti-container"></div>

  <!-- Setup: create a new game or join an existing one by ID. Hidden once a game is active. -->
  <div id="setup">
    <div>
      <h3>Create Game</h3>
      <input id="new-p1" placeholder="Your Name">
      <span> vs. </span>
      <input id="new-p2" placeholder="Opponent's Name (optional)">
      <br>
      <h3>Settings (optional)</h3>
      <div class="settings-grid">
        <input id="new-size" type="number" placeholder="Size of board (default 9)">
        <input id="new-fences" type="number" placeholder="# of fences (default 10)">
        <label>Your color: <select id="new-p1-color"></select></label>
        <label>Opponent's color: <select id="new-p2-color"></select></label>
      </div>
      <br>
      <button class="primary-btn" onclick="createGame()">Create</button>
    </div>
    <div style="margin-top:1.2in;">
      <h3>Join Game</h3>
      <input id="join-id" placeholder="game id">
      <input id="join-name" placeholder="Your Name (optional)">
      <br>
      <button class="primary-btn" onclick="joinGame()">Join</button>
    </div>
    <div id="setup-error" style="color:#ff8080;"></div>
  </div>

  <div id="game" style="display:none;">
    <div id="game-id-display"></div>
    <button id="invite-link-btn" onclick="copyInviteLink()">Copy Invite Link</button>
    <button onclick="leaveGame()">Leave Game</button>
    <div id="status"></div>

    <div id="game-columns">
      <div id="game-main">
        <div id="message" style="display:none; color:#ffd27f; font-weight:bold;"></div>
        <div id="fence-confirm-buttons" style="display:none;">
          <button onclick="confirmFence()">Confirm</button>
          <button onclick="cancelFence()">Cancel</button>
        </div>
        <button onclick="undoLastTurn()">Undo Last Turn</button>
        <div id="board-wrapper">
          <div id="col-labels"></div>
          <div id="row-labels"></div>
          <div id="board"></div>
        </div>
        <div id="players"></div>

        <div id="controls">
          <h3>Move</h3>
          <button onclick="doMove('up')">Up</button>
          <button onclick="doMove('down')">Down</button>
          <button onclick="doMove('left')">Left</button>
          <button onclick="doMove('right')">Right</button>

          <h3>Place Fence</h3>
          <input id="fence-row" placeholder='row (e.g., "3"), or full location (e.g. "B3")'>
          <input id="fence-col" placeholder='column (e.g., "B", or "2"), or blank if you entered full location in first box'>
          <select id="fence-orientation">
            <option value="H">Horizontal</option>
            <option value="V">Vertical</option>
          </select>
          <button onclick="doFence()">Place Fence</button>
        </div>
      </div>

      <div id="move-log">
        <h3>Move Log</h3>
        <ul id="move-log-list"></ul>
      </div>
    </div>
  </div>

<script>
  // ---------------------------------------------------------------
  // API wiring. Same-origin by default (index.html served by app.py
  // itself via StaticFiles) -- set API_BASE if serving this file
  // some other way (e.g. opening it directly as a file:// URL).
  // ---------------------------------------------------------------
  const API_BASE = "";
  let gameId = null;
  let myPlayerIndex = 0;
  let pollHandle = null;
  let pollIntervalMs = null;
  let lastKnownHistory = [];

  // Color choices for the Create Game dropdowns -- the server only stores the name
  const PLAYER_COLORS = {
    blue:   { label: "🟦 Blue",   hex: "#4da3ff" },
    red:    { label: "🟥 Red",    hex: "#FF7F7F" },
    green:  { label: "🟩 Green",  hex: "#5fd068" },
    yellow: { label: "🟨 Yellow", hex: "#ffd84d" },
    purple: { label: "🟪 Purple", hex: "#b388ff" },
    orange: { label: "🟧 Orange", hex: "#ffa94d" },
  };

  [["new-p1-color", "blue"], ["new-p2-color", "red"]].forEach(([id, defaultColor]) => {
    const select = document.getElementById(id);
    for (const [name, { label }] of Object.entries(PLAYER_COLORS)) {
      select.add(new Option(label, name, false, name === defaultColor));
    }
  });

  async function apiCall(path, options) {
    const res = await fetch(API_BASE + path, options);
    let body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      // FastAPI validation errors (422) come back as {"detail": [...]}
      // or {"detail": "message"} for our HTTPException 404s.
      const detail = body && body.detail;
      // Pydantic prefixes custom validator messages with "Value error, " --
      // strip it so our own friendly messages show cleanly.
      const message = Array.isArray(detail)
        ? detail.map(d => d.msg.replace(/^Value error,\s*/, "")).join("; ")
        : (detail || `Request failed (${res.status})`);
      throw new Error(message);
    }
    return body;
  }

  async function createGame() {
    document.getElementById("setup-error").textContent = "";
    try {
      const body = await apiCall("/games", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          player1_name: document.getElementById("new-p1").value,
          player2_name: document.getElementById("new-p2").value.trim() || "Player 2",
          size: Number(document.getElementById("new-size").value) || 9,
          fences: Number(document.getElementById("new-fences").value) || 10,
          player1_color: document.getElementById("new-p1-color").value,
          player2_color: document.getElementById("new-p2-color").value,
        }),
      });
      gameId = body.game_id;
      myPlayerIndex = 0; // creator plays as player 0
      enterGame(body.state);
    } catch (err) {
      document.getElementById("setup-error").textContent = err.message;
    }
  }

  async function joinGame() {
    document.getElementById("setup-error").textContent = "";
    try {
      const id = document.getElementById("join-id").value.trim();
      const result = await apiCall(`/games/${id}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: document.getElementById("join-name").value }),
      });
      if (!result.ok) {
        document.getElementById("setup-error").textContent = result.error;
        return;
      }
      gameId = id;
      myPlayerIndex = result.player_index;
      enterGame(result.state);
    } catch (err) {
      document.getElementById("setup-error").textContent = err.message;
    }
  }

  // Remember which game/seat this browser is in, so a page refresh
  // re-enters the same game instead of dumping you back at setup --
  // wrapped in try/catch since localStorage can be unavailable (private
  // browsing, blocked site data) and this is a convenience, not a
  // requirement for the app to work.
  function saveSession() {
    try {
      localStorage.setItem("quoridor_session", JSON.stringify({ gameId, myPlayerIndex }));
    } catch (e) { /* not critical -- just won't survive a refresh this time */ }
  }

  function clearSession() {
    try { localStorage.removeItem("quoridor_session"); } catch (e) { /* ignore */ }
  }

  function loadSession() {
    try {
      const raw = localStorage.getItem("quoridor_session");
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function leaveGame() {
    clearSession();
    location.href = location.pathname; // also drops any ?join=... query param
  }

  async function copyInviteLink() {
    const link = `${location.origin}${location.pathname}?join=${gameId}`;
    await navigator.clipboard.writeText(link);
    const btn = document.getElementById("invite-link-btn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = original; }, 1500);
  }

  // Checked on page load, after tryResumeSession() finds nothing to
  // resume. If the URL has ?join=<id>, join that game automatically with
  // a blank name -- leaving whatever name is already there (the default
  // "Player 2" or whatever the creator chose) and just marking it claimed.
  async function tryJoinFromInviteLink() {
    const joinId = new URLSearchParams(location.search).get("join");
    if (!joinId) return false;
    try {
      const result = await apiCall(`/games/${joinId}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: "" }),
      });
      if (!result.ok) {
        document.getElementById("setup-error").textContent = result.error;
        return false;
      }
      gameId = joinId;
      myPlayerIndex = result.player_index;
      enterGame(result.state);
      return true;
    } catch (err) {
      document.getElementById("setup-error").textContent = err.message;
      return false;
    }
  }

  // Called once on page load. Returns true if it successfully re-entered
  // a remembered game, false if there was nothing to resume (or it was
  // stale/invalid) and the setup screen should show normally instead.
  async function tryResumeSession() {
    const session = loadSession();
    if (!session) return false;
    try {
      const state = await apiCall(`/games/${session.gameId}`);
      gameId = session.gameId;
      myPlayerIndex = session.myPlayerIndex;
      enterGame(state);
      return true;
    } catch (err) {
      clearSession(); // game no longer exists or ID is bad -- don't keep retrying it
      return false;
    }
  }

  function enterGame(state) {
    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("game-id-display").textContent = `Game ID: ${gameId} (you are ${state.players[myPlayerIndex].name})`;
    saveSession();
    render(state);
  }

  // Fast polling while waiting on the opponent's move, slower on our own
  // turn (just a safety net to catch an opponent undoing their last turn
  // after handing it back to us). Stops entirely once the game's over.
  function updatePolling(state) {
    if (state.status !== "playing") {
      if (pollHandle) { clearInterval(pollHandle); pollHandle = null; pollIntervalMs = null; }
      return;
    }
    const interval = state.current_player === myPlayerIndex ? 5000 : 1000;
    if (pollIntervalMs !== interval) {
      if (pollHandle) clearInterval(pollHandle);
      pollHandle = setInterval(refreshState, interval);
      pollIntervalMs = interval;
    }
  }

  async function refreshState() {
    try {
      const state = await apiCall(`/games/${gameId}`);
      render(state);
    } catch (err) {
      showMessage(err.message);
    }
  }

  async function doMove(direction) {
    clearMessage();
    try {
      const result = await apiCall(`/games/${gameId}/move`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player_index: myPlayerIndex, direction }),
      });
      if (!result.ok) {
        showMessage(result.error);
      } else {
        render(result.state);
      }
    } catch (err) {
      showMessage(err.message);
    }
  }

  async function undoLastTurn() {
    clearMessage();
    try {
      const result = await apiCall(`/games/${gameId}/undo`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player_index: myPlayerIndex }),
      });
      if (!result.ok) {
        showMessage(result.error);
      } else {
        lastKnownHistory = result.state.history || []; // don't notify myself about my own undo
        render(result.state);
      }
    } catch (err) {
      showMessage(err.message);
    }
  }

  // One shared spot for errors, undo notices, and the fence-confirm
  // prompt -- above the board, all styled the same way.
  function showMessage(text) {
    const el = document.getElementById("message");
    el.textContent = text;
    el.style.display = "block";
  }

  function clearMessage() {
    const el = document.getElementById("message");
    el.textContent = "";
    el.style.display = "none";
  }

  // Locks every control in #controls so you can't move or start another
  // fence mid-decision (Confirm/Cancel live outside #controls now).
  function setControlsDisabled(disabled) {
    document.querySelectorAll("#controls button, #controls input, #controls select").forEach((el) => {
      el.disabled = disabled;
    });
  }

  // Set while a fence preview is showing, awaiting Confirm/Cancel --
  // holds exactly what gets sent to the real /fence endpoint on confirm.
  let pendingFence = null;

  // Accepts a row+column from the two fence-location boxes in whatever
  // form they're filled in: a lone letter (column) and lone number (row)
  // split across both boxes in either order, or a single combined value
  // like "B3" (or "3B") in one box with the other left blank. Returns
  // null if neither pattern matches.
  function parseFenceLocation(rawA, rawB) {
    const a = rawA.trim().toUpperCase();
    const b = rawB.trim().toUpperCase();

    const combined = (a && !b) ? a : (!a && b) ? b : null;
    if (combined) {
      const m = combined.match(/^([A-Z])(\d+)$/) || combined.match(/^(\d+)([A-Z])$/);
      if (!m) return null;
      const letter = /[A-Z]/.test(m[1]) ? m[1] : m[2];
      const number = /[A-Z]/.test(m[1]) ? m[2] : m[1];
      return { row: Number(number), col: letter.charCodeAt(0) - 64 };
    }

    // Both boxes filled separately. If one is a column letter, the other
    // (whichever box) is the row number. If neither is a letter -- both
    // are plain numbers -- there's no way to tell row from column except
    // by position, so fall back to the boxes' natural order: first box
    // is row, second is column.
    const isLetter = (v) => /^[A-Z]$/.test(v);
    const isNumber = (v) => /^\d+$/.test(v);

    if (isLetter(a) && isNumber(b)) return { row: Number(b), col: a.charCodeAt(0) - 64 };
    if (isLetter(b) && isNumber(a)) return { row: Number(a), col: b.charCodeAt(0) - 64 };
    if (isNumber(a) && isNumber(b)) return { row: Number(a), col: Number(b) };
    return null;
  }

  async function doFence() {
    clearMessage();
    const location = parseFenceLocation(
      document.getElementById("fence-row").value,
      document.getElementById("fence-col").value
    );
    if (!location) {
      showMessage('Enter a row and column (e.g. "3" and "B"), or a full location like "B3" in one box.');
      return;
    }
    const { row, col } = location;
    const orientation = document.getElementById("fence-orientation").value;
    try {
      // /fence/preview runs the same legality checks as the real endpoint
      // but never saves anything -- nothing here is visible to the
      // opponent or advances the turn until Confirm is clicked.
      const result = await apiCall(`/games/${gameId}/fence/preview`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player_index: myPlayerIndex, row, col, orientation }),
      });
      if (!result.ok) {
        showMessage(result.error);
        return;
      }
      // Pause polling while previewing -- otherwise a poll tick fetches
      // the real (un-fenced) state mid-preview and overwrites what's shown.
      if (pollHandle) { clearInterval(pollHandle); pollHandle = null; pollIntervalMs = null; }
      // Not renderStatus() -- the turn hasn't actually changed yet, only
      // the board/fence-count preview should update until Confirm.
      renderBoard(result.state);
      renderPlayers(result.state);
      pendingFence = { row, col, orientation };
      const orientationLabel = orientation === "H" ? "Horizontal" : "Vertical";
      showMessage(`${orientationLabel} fence placed at ${result.location}. Confirm, or cancel?`);
      document.getElementById("fence-confirm-buttons").style.display = "block";
      setControlsDisabled(true);
    } catch (err) {
      showMessage(err.message);
    }
  }

  async function confirmFence() {
    clearMessage();
    try {
      const result = await apiCall(`/games/${gameId}/fence`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player_index: myPlayerIndex, ...pendingFence }),
      });
      if (!result.ok) {
        // Shouldn't normally happen since preview already validated this,
        // but the board could in principle have changed in between.
        showMessage(result.error);
        await refreshState();
      } else {
        render(result.state);
      }
    } catch (err) {
      showMessage(err.message);
    } finally {
      pendingFence = null;
      document.getElementById("fence-confirm-buttons").style.display = "none";
      setControlsDisabled(false);
    }
  }

  async function cancelFence() {
    pendingFence = null;
    document.getElementById("fence-confirm-buttons").style.display = "none";
    setControlsDisabled(false);
    clearMessage();
    await refreshState(); // nothing was ever saved -- just re-show the real state
  }
</script>

<script>
  // ---------------------------------------------------------------
  // Rendering. Consumes real state from GET/POST /games responses
  // (see apiCall functions above) -- this shape is defined by
  // QuoridorGame.serialize() in Quoridor_objects.py.
  // ---------------------------------------------------------------
  function renderBoard(state) {
    const size = state.board_size;
    const board = document.getElementById("board");
    board.innerHTML = ""; // clear out anything from a previous render

    // Build the interleaved track sizes: cell, gutter, cell, gutter, ... cell
    const cellSize = "44px";
    const gutterSize = "10px";
    const tracks = [];
    for (let i = 0; i < size; i++) {
      tracks.push(cellSize);
      if (i < size - 1) tracks.push(gutterSize);
    }
    board.style.gridTemplateColumns = tracks.join(" ");
    board.style.gridTemplateRows = tracks.join(" ");

    // A board cell (row r, col c) -- both 1-indexed like the server uses --
    // sits at grid track (2r - 1, 2c - 1) once gutters are interleaved.
    const cellTrack = (n) => 2 * n - 1;

    // --- column letters above the board, row numbers to its left --
    // same track sizes as the board itself, so each label lines up with
    // its actual column/row regardless of board size.
    const colLabels = document.getElementById("col-labels");
    colLabels.innerHTML = "";
    colLabels.style.gridTemplateColumns = tracks.join(" ");
    for (let c = 1; c <= size; c++) {
      const label = document.createElement("div");
      label.className = "board-label";
      label.style.gridColumn = cellTrack(c);
      label.textContent = String.fromCharCode(64 + c); // 1 -> A, 2 -> B, ...
      colLabels.appendChild(label);
    }

    const rowLabels = document.getElementById("row-labels");
    rowLabels.innerHTML = "";
    rowLabels.style.gridTemplateRows = tracks.join(" ");
    for (let r = 1; r <= size; r++) {
      const label = document.createElement("div");
      label.className = "board-label";
      label.style.gridRow = cellTrack(r);
      label.textContent = r;
      rowLabels.appendChild(label);
    }

    // --- draw every board square ---
    for (let r = 1; r <= size; r++) {
      for (let c = 1; c <= size; c++) {
        const div = document.createElement("div");
        div.className = "cell";
        div.style.gridRow = cellTrack(r);
        div.style.gridColumn = cellTrack(c);
        board.appendChild(div);
      }
    }

    // --- draw both players' pieces ---
    state.players.forEach((player, idx) => {
      const [r, c] = player.location;
      const piece = document.createElement("div");
      piece.className = `piece owner-${idx}`;
      piece.style.gridRow = cellTrack(r);
      piece.style.gridColumn = cellTrack(c);
      board.appendChild(piece);
    });

    // --- draw horizontal fences ---
    // A horizontal fence at (row, col) sits in the gutter directly above
    // "row", spanning across columns col and col+1 (3 tracks: cell,
    // gutter, cell).
    state.fences.horizontal.forEach(([row, col, owner]) => {
      const fence = document.createElement("div");
      fence.className = `fence owner-${owner}`;
      fence.style.gridRow = cellTrack(row) - 1;             // the gutter row above it
      fence.style.gridColumn = `${cellTrack(col)} / span 3`;
      board.appendChild(fence);
    });

    // --- draw vertical fences ---
    // A vertical fence at (row, col) sits in the gutter directly left of
    // "col", spanning across rows row and row+1 (3 tracks).
    state.fences.vertical.forEach(([row, col, owner]) => {
      const fence = document.createElement("div");
      fence.className = `fence owner-${owner}`;
      fence.style.gridRow = `${cellTrack(row)} / span 3`;
      fence.style.gridColumn = cellTrack(col) - 1;           // the gutter column left of it
      board.appendChild(fence);
    });
  }

  function spawnConfetti() {
    const container = document.getElementById("confetti-container");
    const colors = ["#ffd700", "#ff6b6b", "#4ecdc4", "#a78bfa", "#ff9f43"];
    for (let i = 0; i < 20; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = `${Math.random() * 0.5}s`;
      piece.style.animationDuration = `${2 + Math.random()}s`;
      container.appendChild(piece);
      setTimeout(() => piece.remove(), 3000);
    }
  }

  let lastKnownStatus = "playing";

  function renderStatus(state) {
    let text;
    let isMyTurn = false;
    let isGameOver = false;
    if (state.status === "game_over") {
      text = `${state.winner} wins!`;
      isGameOver = true;
    } else if (state.current_player === myPlayerIndex) {
      text = "Your Turn";
      isMyTurn = true;
    } else {
      text = `${state.players[state.current_player].name}'s turn`;
    }
    if (isGameOver && lastKnownStatus !== "game_over") {
      spawnConfetti();
    }
    lastKnownStatus = state.status;
    const statusEl = document.getElementById("status");
    statusEl.textContent = text;
    statusEl.classList.toggle("my-turn", isMyTurn);
    statusEl.classList.toggle("game-over", isGameOver);
  }

  function renderMoveLog(state) {
    const list = document.getElementById("move-log-list");
    list.innerHTML = "";
    (state.history || []).forEach((entry) => {
      const li = document.createElement("li");
      const turnLabel = entry.bonus ? `${entry.turn}b` : entry.turn;
      if (entry.action === "move") {
        li.textContent = `${turnLabel}. ${entry.player_name} moves ${entry.direction} to ${entry.to_a1}`;
      } else {
        const orientationLabel = entry.orientation === "H" ? "horizontal" : "vertical";
        li.textContent = `${turnLabel}. ${entry.player_name} places ${orientationLabel} fence at ${entry.location_a1}`;
      }
      list.appendChild(li);
    });
  }

  // Detects an undo by noticing history got shorter than what we last
  // saw, and names whoever's entry just disappeared.
  // Only ever shows the message -- hiding it is a separate, explicit step
  // (clearMessage), triggered by the viewer's own next move.
  function checkUndoNotice(state) {
    const newHistory = state.history || [];
    if (newHistory.length < lastKnownHistory.length) {
      const undoneEntry = lastKnownHistory[lastKnownHistory.length - 1];
      showMessage(`${undoneEntry.player_name} undid their last turn.`);
    }
    lastKnownHistory = newHistory;
  }

  function renderPlayers(state) {
    const container = document.getElementById("players");
    container.innerHTML = "";
    state.players.forEach((player, idx) => {
      const card = document.createElement("div");
      card.className = `player-card owner-${idx}` + (idx === state.current_player ? " turn" : "");
      card.textContent = `${player.name} — ${player.fences_remaining} fences left`;
      container.appendChild(card);
    });
  }

  function render(state) {
    // swap in this game's colors (games saved before colors existed keep the :root defaults)
    state.players.forEach((player, idx) => {
      const hex = PLAYER_COLORS[player.color]?.hex;
      if (hex) document.documentElement.style.setProperty(`--player${idx}-color`, hex);
    });
    renderStatus(state);
    renderBoard(state);
    renderPlayers(state);
    renderMoveLog(state);
    checkUndoNotice(state);
    updatePolling(state);
  }

  // Run once the page loads: if this browser was already in a game,
  // re-enter it directly. Otherwise, check for an invite link. If
  // neither applies, the setup screen just shows normally.
  (async () => {
    const resumed = await tryResumeSession();
    if (!resumed) await tryJoinFromInviteLink();
  })();
</script>

</body>
</html>
