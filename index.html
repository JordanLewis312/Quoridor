<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quoridor</title>
<style>
  /* ---------- basic page styling ---------- */
  /* Each player's color is defined once here, then referenced by name
     everywhere else via var(--name). */
  :root {
    --player0-color: #4da3ff;
    --player1-color: #FF7F7F;
  }

  body {
    font-family: sans-serif;
    background: #1e1e1e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }

  #status {
    margin-bottom: 1rem;
    text-align: center;
  }

  /* #board is a CSS grid, alternating a thin "gutter" between
     every pair of cells for fences Fences So the full grid
     is (2N - 1) tracks wide and tall (2N - 1) tracks tall:
 */
  #board {
    display: grid;
    background: #444;
    border: 3px solid #666;
  }

  .cell {
    background: #C79377; /* board square color */
  }

  .gutter {
    background: transparent; /* empty space unless a fence occupies it */
  }

  .fence {
    border-radius: 2px;
  }
  .fence.owner-0 { background: var(--player0-color); } /* player 1's fences */
  .fence.owner-1 { background: var(--player1-color); } /* player 2's fences */

  .piece {
    width: 70%;
    height: 70%;
    margin: 15%;
    border-radius: 50%;
    box-sizing: border-box;
    border: 2px solid #222;
  }
  .piece.owner-0 { background: var(--player0-color); } /* player 1's piece */
  .piece.owner-1 { background: var(--player1-color); } /* player 2's piece */

  #players {
    display: flex;
    gap: 2rem;
    margin-top: 1rem;
  }
  .player-card {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: 2px solid transparent;
  }
  .player-card.turn { border-color: #fff; }
  .player-card.owner-0 { background: #2b3a4a; }
  .player-card.owner-1 { background: #4a332b; }
</style>
</head>
<body>

  <h1>Quoridor</h1>

  <!-- Setup: create a new game or join an existing one by ID. Hidden once a game is active. -->
  <div id="setup">
    <div>
      <h3>Create Game</h3>
      <input id="new-p1" placeholder="Player 1 name">
      <input id="new-p2" placeholder="Player 2 name">
      <input id="new-size" type="number" placeholder="size (3-10)" value="9">
      <input id="new-fences" type="number" placeholder="fences (1-15)" value="10">
      <button onclick="createGame()">Create</button>
    </div>
    <div>
      <h3>Join Game</h3>
      <input id="join-id" placeholder="game id">
      <input id="join-player-index" type="number" placeholder="your player index (0 or 1)" value="0">
      <button onclick="joinGame()">Join</button>
    </div>
    <div id="setup-error" style="color:#ff8080;"></div>
  </div>

  <div id="game" style="display:none;">
    <div id="game-id-display"></div>
    <div id="status"></div>
    <div id="board"></div>
    <div id="players"></div>

    <div id="controls">
      <h3>Move</h3>
      <button onclick="doMove('up')">Up</button>
      <button onclick="doMove('down')">Down</button>
      <button onclick="doMove('left')">Left</button>
      <button onclick="doMove('right')">Right</button>

      <h3>Place Fence</h3>
      <input id="fence-row" type="number" placeholder="row">
      <input id="fence-col" type="number" placeholder="col">
      <select id="fence-orientation">
        <option value="H">Horizontal</option>
        <option value="V">Vertical</option>
      </select>
      <button onclick="doFence()">Place Fence</button>
    </div>
    <div id="action-error" style="color:#ff8080;"></div>
  </div>

<script>
  // ---------------------------------------------------------------
  // API wiring. Same-origin by default (index.html served by app.py
  // itself via StaticFiles) -- set API_BASE if serving this file
  // some other way (e.g. opening it directly as a file:// URL).
  // ---------------------------------------------------------------
  const API_BASE = "";
  let gameId = null;
  let myPlayerIndex = 0;
  let pollHandle = null;

  async function apiCall(path, options) {
    const res = await fetch(API_BASE + path, options);
    let body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      // FastAPI validation errors (422) come back as {"detail": [...]}
      // or {"detail": "message"} for our HTTPException 404s.
      const detail = body && body.detail;
      const message = Array.isArray(detail)
        ? detail.map(d => d.msg).join("; ")
        : (detail || `Request failed (${res.status})`);
      throw new Error(message);
    }
    return body;
  }

  async function createGame() {
    document.getElementById("setup-error").textContent = "";
    try {
      const body = await apiCall("/games", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          player1_name: document.getElementById("new-p1").value,
          player2_name: document.getElementById("new-p2").value,
          size: Number(document.getElementById("new-size").value),
          fences: Number(document.getElementById("new-fences").value),
        }),
      });
      gameId = body.game_id;
      myPlayerIndex = 0; // creator plays as player 0
      enterGame(body.state);
    } catch (err) {
      document.getElementById("setup-error").textContent = err.message;
    }
  }

  async function joinGame() {
    document.getElementById("setup-error").textContent = "";
    try {
      const id = document.getElementById("join-id").value.trim();
      const state = await apiCall(`/games/${id}`);
      gameId = id;
      myPlayerIndex = Number(document.getElementById("join-player-index").value);
      enterGame(state);
    } catch (err) {
      document.getElementById("setup-error").textContent = err.message;
    }
  }

  function enterGame(state) {
    document.getElementById("setup").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("game-id-display").textContent = `Game ID: ${gameId} (you are player ${myPlayerIndex})`;
    render(state);
  }

  // Poll only while we're actually waiting on something to change --
  // i.e. it's the opponent's turn and the game isn't over. Our own
  // moves/fences already re-render straight from their response, so
  // there's nothing to catch by polling on our own turn.
  function updatePolling(state) {
    const waitingOnOpponent = state.status === "playing" && state.current_player !== myPlayerIndex;
    if (waitingOnOpponent && !pollHandle) {
      pollHandle = setInterval(refreshState, 5000);
    } else if (!waitingOnOpponent && pollHandle) {
      clearInterval(pollHandle);
      pollHandle = null;
    }
  }

  async function refreshState() {
    try {
      const state = await apiCall(`/games/${gameId}`);
      render(state);
    } catch (err) {
      document.getElementById("action-error").textContent = err.message;
    }
  }

  async function doMove(direction) {
    document.getElementById("action-error").textContent = "";
    try {
      const result = await apiCall(`/games/${gameId}/move`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ player_index: myPlayerIndex, direction }),
      });
      if (!result.ok) {
        document.getElementById("action-error").textContent = result.error;
      } else {
        render(result.state);
      }
    } catch (err) {
      document.getElementById("action-error").textContent = err.message;
    }
  }

  async function doFence() {
    document.getElementById("action-error").textContent = "";
    try {
      const result = await apiCall(`/games/${gameId}/fence`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          player_index: myPlayerIndex,
          row: Number(document.getElementById("fence-row").value),
          col: Number(document.getElementById("fence-col").value),
          orientation: document.getElementById("fence-orientation").value,
        }),
      });
      if (!result.ok) {
        document.getElementById("action-error").textContent = result.error;
      } else {
        render(result.state);
      }
    } catch (err) {
      document.getElementById("action-error").textContent = err.message;
    }
  }
</script>

<script>
  // ---------------------------------------------------------------
  // Rendering. Consumes real state from GET/POST /games responses
  // (see apiCall functions above) -- this shape is defined by
  // QuoridorGame.serialize() in Quoridor_objects.py.
  // ---------------------------------------------------------------
  function renderBoard(state) {
    const size = state.board_size;
    const board = document.getElementById("board");
    board.innerHTML = ""; // clear out anything from a previous render

    // Build the interleaved track sizes: cell, gutter, cell, gutter, ... cell
    const cellSize = "44px";
    const gutterSize = "10px";
    const tracks = [];
    for (let i = 0; i < size; i++) {
      tracks.push(cellSize);
      if (i < size - 1) tracks.push(gutterSize);
    }
    board.style.gridTemplateColumns = tracks.join(" ");
    board.style.gridTemplateRows = tracks.join(" ");

    // A board cell (row r, col c) -- both 1-indexed like the server uses --
    // sits at grid track (2r - 1, 2c - 1) once gutters are interleaved.
    const cellTrack = (n) => 2 * n - 1;

    // --- draw every board square ---
    for (let r = 1; r <= size; r++) {
      for (let c = 1; c <= size; c++) {
        const div = document.createElement("div");
        div.className = "cell";
        div.style.gridRow = cellTrack(r);
        div.style.gridColumn = cellTrack(c);
        board.appendChild(div);
      }
    }

    // --- draw both players' pieces ---
    state.players.forEach((player, idx) => {
      const [r, c] = player.location;
      const piece = document.createElement("div");
      piece.className = `piece owner-${idx}`;
      piece.style.gridRow = cellTrack(r);
      piece.style.gridColumn = cellTrack(c);
      board.appendChild(piece);
    });

    // --- draw horizontal fences ---
    // A horizontal fence at (row, col) sits in the gutter directly above
    // "row", spanning across columns col and col+1 (3 tracks: cell,
    // gutter, cell).
    state.fences.horizontal.forEach(([row, col, owner]) => {
      const fence = document.createElement("div");
      fence.className = `fence owner-${owner}`;
      fence.style.gridRow = cellTrack(row) - 1;             // the gutter row above it
      fence.style.gridColumn = `${cellTrack(col)} / span 3`;
      board.appendChild(fence);
    });

    // --- draw vertical fences ---
    // A vertical fence at (row, col) sits in the gutter directly left of
    // "col", spanning across rows row and row+1 (3 tracks).
    state.fences.vertical.forEach(([row, col, owner]) => {
      const fence = document.createElement("div");
      fence.className = `fence owner-${owner}`;
      fence.style.gridRow = `${cellTrack(row)} / span 3`;
      fence.style.gridColumn = cellTrack(col) - 1;           // the gutter column left of it
      board.appendChild(fence);
    });
  }

  function renderStatus(state) {
    document.getElementById("status").textContent =
      state.status === "game_over"
        ? `${state.winner} wins!`
        : `${state.players[state.current_player].name}'s turn`;
  }

  function renderPlayers(state) {
    const container = document.getElementById("players");
    container.innerHTML = "";
    state.players.forEach((player, idx) => {
      const card = document.createElement("div");
      card.className = `player-card owner-${idx}` + (idx === state.current_player ? " turn" : "");
      card.textContent = `${player.name} — ${player.fences_remaining} fences left`;
      container.appendChild(card);
    });
  }

  function render(state) {
    renderStatus(state);
    renderBoard(state);
    renderPlayers(state);
    updatePolling(state);
  }
</script>

</body>
</html>
